name: Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bank_analytics_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d bank_analytics_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bank_analytics_test
      SECRET_KEY: chave-secreta-apenas-para-testes-do-ci

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        run: python -m pytest